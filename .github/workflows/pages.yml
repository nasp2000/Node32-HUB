name: Site

# Publishes site/ to the gh-pages branch (GitHub Pages serves that branch).
# No build step: the pages are static HTML/CSS.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish site/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
              commit -qm "site: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
