name: Site

# Builds site/ into a publishable tree (versions from the releases, releases page,
# search index, sitemap, WebP) and pushes it to the gh-pages branch, which is what
# GitHub Pages serves.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/release_targets.json"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg (WebP twins)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python site/scripts/build_site.py --out _site

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
              commit -qm "site: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
