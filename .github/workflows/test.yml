 # Native + static tests (CI remoto, ordem Nuno 2026-11).
 name: test

 on:
   push:
     branches: [main, master]
   pull_request:
     branches: [main, master]

 concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

 jobs:
   # ── Python static tests (PSRAM guards + pack validation) ──────────
   static:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - name: Set up Python
         uses: actions/setup-python@v5
         with:
           python-version: "3.12"
       - name: Install dependencies
         run: pip install -r tests/requirements.txt
       - name: PSRAM + pack validation
         run: python -m pytest tests/test_psram_guards.py tests/test_validate_packs.py -v

   # ── Native C++ unit tests (modbus CRC, charset, string utils, etc.) ──
   native:
     runs-on: ubuntu-latest
     defaults:
       run:
         working-directory: tests/native
     steps:
       - uses: actions/checkout@v4
       - name: Install system deps
         run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ make
       - name: Build native tests
         run: make -C tests/native all
       - name: Run native tests
         run: |
           cd tests/native
           for bin in test_modbus_crc test_charset test_string_utils; do
             echo "=== $bin ==="
             ./$bin
           done
           echo "=== All native tests passed ==="
