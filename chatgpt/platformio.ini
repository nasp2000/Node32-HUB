; PlatformIO configuration for Node32-Hub (ESP32-S3)
;
; TWO ENVIRONMENTS — select from the PlatformIO toolbar or CLI:
;   pio run -e n16r8              -> N16R8 devkit (default board)
;   pio run -e waveshare_8di8do   -> Waveshare ESP32-S3 POE-ETH-8DI-8DO
;
; USB Serial note:
;   N16R8 has a dedicated UART bridge (CH340) — CDC_ON_BOOT must be 0
;   so Serial goes to the bridge, not the native USB port.
;   Waveshare has ONLY native USB (no bridge chip) — CDC_ON_BOOT must be 1
;   or Serial output never appears. Each environment sets this automatically.

; ---------------------------------------------------------------------------
; Project-level options (not inherited by [env] children)
; ---------------------------------------------------------------------------
[platformio]
src_dir = .
build_cache_dir = .pio/ccache
; Build artifacts go to tmpfs (RAM) instead of the SSD. The Pi 4 has 8 GB RAM
; and /tmp is a 4 GB tmpfs, so a single board build (~230 MB) fits comfortably
; and writes ZERO bytes to the USB SSD. Cache survives the build; lost on reboot
; (rebuilds then miss ccache, but ccache itself lives on disk and re-warms).
build_dir = /tmp/pio-build
; Parallel jobs: pioarduino uses all CPU cores by default via SCons.
; To override explicitly, use CLI: pio run -j 12

; ---------------------------------------------------------------------------
; Build speed — ccache + parallel jobs
; ---------------------------------------------------------------------------
; ccache transparently caches compiled object files by source+flags hash.
; On a re-build where only 2 files changed, all other TUs are served from
; cache in <1 ms each instead of recompiling (~30s each).
;
; Installation (run once, then re-open the project):
;   winget install ccache           (Windows — winget)
;   scoop install ccache            (Windows — Scoop)
;   brew install ccache             (macOS)
;   sudo apt install ccache         (Linux)
;
; After install, PlatformIO picks it up automatically via the setting below.
; Verify it works: after a full build, run: ccache -s
[env]
; pioarduino 55.03.35 = arduino-esp32 3.3.5 / IDF 5.5.1
; Same version as Arduino IDE board package 3.3.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
extra_scripts =
  pre:scripts/validate_i18n.py
  pre:scripts/validate_feature_flags.py
  pre:scripts/validate_packs.py
  pre:scripts/validate_third_party.py
  pre:scripts/validate_version.py
  pre:scripts/inject_pack_flags.py
  pre:scripts/run_native_tests.py
  pre:scripts/ccache.py
  pre:fix_includes.py
  scripts/link_esp_audio_codec.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, default
lib_ldf_mode = chain+
lib_deps =
	bblanchon/ArduinoJson @ 6.21.6
	ESP32Async/AsyncTCP @ 3.5.0
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	rlogiacco/CircularBuffer @ 1.4.0
	adafruit/Adafruit SSD1306 @ 2.5.17
	adafruit/Adafruit GFX Library @ 1.12.6
	adafruit/Adafruit AHTX0 @ 2.0.6
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BusIO @ 1.17.4
  arduino-libraries/Ethernet @ 2.0.2
  greiman/SdFat @ 2.3.1
  ; ALL deps are pinned to exact versions (no ^ / ~): a fresh install or
  ; `pio pkg update` must not silently change behaviour or licenses.
  ; ReadyMail: PINNED to 0.4.0 — 0.4.1+ switched to a non-commercial license
  ; (0.4.1 "ReadyMail Custom License", 0.4.2 CC-BY-NC-4.0, commercial licence
  ;  USD 25). 0.3.6–0.4.0 are MIT. Do NOT relax to ^0.4.0 (it resolves to 0.4.2).
  mobizt/ReadyMail @ 0.4.0
  mobizt/ESP_SSLClient @ 3.1.3
; ccache: transparent compiler cache — dramatically speeds up incremental builds.
; PlatformIO uses ccache automatically when it is installed in PATH.
; First build is normal speed; subsequent builds only recompile changed files.
; All 177 unchanged TUs are served from cache in milliseconds.
; See installation note at the top of this file.
build_flags =
  ${common_build.build_flags}
  ; --- PSRAM threshold — overridden per board below ---
  -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=65536  ; allocs <64KB stay in fast internal RAM
  ; --- Stack / USB ---
  ; ARDUINO_USB_MODE is NOT set here on purpose: it must be explicit per-env
  ; (device mode =1 is the framework default). Setting =1 in [env] then =0 in
  ; [env:n16r8]/[env:esp32p4] redefines the macro on the compiler command line
  ; and spews "ARDUINO_USB_MODE redefined" warnings for every TU. The host-mode
  ; envs set =0 themselves below.
  -DARDUINO_LOOP_STACK_SIZE=16384
; Shared source filter (excludes src/touch7_ui/** EEZ export, managed_components
; test trees and stray build dirs). P4 overrides this with its own env section
; below but points at the same value.
build_src_filter = ${common_build.build_src_filter}

; ---------------------------------------------------------------------------
; Common build flags shared by ALL environments (including P4).
; S3-specific overrides live in each [env] section.
; ---------------------------------------------------------------------------
[common_build]
; Shared source filter: `src_dir = .` means the whole project root is scanned, so
; exclude stray build dirs, managed_components test/example trees, and the raw
; EEZ Studio exchange tree (src/touch7_ui/** — LVGL UI sources pulled in from
; TouchMeteo-7, not compiled into the firmware). P4 and the base envs use this.
; `sensor_ov5647/**` is the vendored OV5647 driver (HD modes override): it is
; excluded here for ALL envs and re-included ONLY by [env:esp32p4cam] below
; (the TU self-empties off-P4, but other cores' older esp_cam_sensor headers
; may not even parse it — keep it out of S3 builds entirely).
; `build/**` is the rename_firmware output tree AND the generated third-party
; compliance bundle (build/third-party/lgpl-sources/**) — it holds real .cpp
; (ESPAsyncWebServer examples, AsyncTCP, arduino-esp32) that must NEVER be
; compiled into the firmware.
build_src_filter = +<.> -<.pio/**> -<.pio-linux/**> -<.pio-p4cam/**> -<.dummy/**> -<build/**> -<managed_components/**/tests/*> -<managed_components/**/tests/**> -<managed_components/**/test/*> -<managed_components/**/test/**> -<managed_components/**/test_sim/*> -<managed_components/**/test_sim/**> -<managed_components/**/fuzzing/*> -<managed_components/**/fuzzing/**> -<managed_components/**/examples/*> -<managed_components/**/examples/**> -<managed_components/**/applications/**> -<managed_components/**/isa/esp32/**> -<managed_components/**/isa/esp32s3/**> -<managed_components/**/test.c> -<managed_components/**/test.cpp> -<managed_components/**/sandy2x/*.S> -<managed_components/**/xmm6/*.S> -<managed_components/espressif__dl_fft/**> -<managed_components/espressif__eppp_link/**> -<managed_components/espressif__esp_hosted/**> -<managed_components/espressif__esp-sr/**> -<managed_components/espressif__esp_modem/**> -<managed_components/espressif__esp_serial_slave_link/**> -<managed_components/espressif__esp_wifi_remote/**> -<managed_components/espressif__wifi_remote_over_eppp/**> -<managed_components/espressif__libsodium/**> -<managed_components/espressif__lan867x/**> -<managed_components/espressif__lan86xx_common/**> -<managed_components/joltwallet__littlefs/**> -<managed_components/espressif__mdns/**> -<src/touch7_ui/**> -<sensor_ov5647/**>
build_flags =
  -Isrc
  -O2
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=1000
  -DCONFIG_SPIRAM_SUPPORT
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_USE_MALLOC=1

; ---------------------------------------------------------------------------
; N16R8 devkit — ESP32-S3, 16MB QIO flash, 8MB OPI PSRAM, CH340 UART bridge
; board = esp32-s3-devkitc-1 → uses esp32s3 sdkconfig (not the original ESP32)
; memory_type = qio_opi     → selects precompiled IDF variant with OPI PSRAM
; CDC_ON_BOOT = 0           → Serial goes to CH340 bridge, not native USB
; ---------------------------------------------------------------------------
[env:n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_flags =
  ${env.build_flags}
  -mfix-esp32-psram-cache-issue        ; Xtensa S3: PSRAM cache errata workaround
  -mtext-section-literals              ; Xtensa S3: allow literals in .text section
  -DCONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Native USB port (GPIO19/20) left idle: the S3 CNC pack is UART-only since
  ; 2026-09-06 (USB Host/OTG removed — host stack + Serial2 caused a ~30 s
  ; reboot loop). ARDUINO_USB_MODE=0 keeps the framework TinyUSB device stack
  ; (HWCDC) off these pads so nothing drives them. Serial (monitor) still goes
  ; to the CH340 bridge via UART0 — unaffected.
  -DARDUINO_USB_MODE=0
  ; USB Host: control transfer buffer (256B max for CH340/CP210x config descriptors)
  -DCONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=256
  ; esp_audio_codec (Espressif Modified MIT) — vendored in lib/esp_audio_codec:
  ; headers + prebuilt esp32s3 archive. AAC decoder for the radio stack.
  ; Relative -I (compile runs from chatgpt/); the archive is linked by
  ; scripts/link_esp_audio_codec.py with an absolute path.
  -Ilib/esp_audio_codec/src/include
  -Ilib/esp_audio_codec/src/include/decoder
  -Ilib/esp_audio_codec/src/include/decoder/impl
  -Ilib/esp_audio_codec/src/include/simple_dec
  ; Strip the board's own -DARDUINO_USB_MODE=1 (esp32-s3-devkitc-1.json) so the
  ; compiler only ever sees =0 — otherwise the macro is redefined on every TU.
build_unflags =
  -DARDUINO_USB_MODE=1

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3 POE-ETH-8DI-8DO — ESP32-S3, native USB only, W5500 Ethernet
; CDC_ON_BOOT = 1 — no CH340 bridge; Serial only works via native USB CDC
; ---------------------------------------------------------------------------
[env:waveshare_8di8do]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_flags =
  ${env.build_flags}
  -DTARGET_BOARD_8DI8DO_POE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSELECTED_PACK=PACK_WAVESHARE
  -mfix-esp32-psram-cache-issue        ; Xtensa S3: PSRAM cache errata workaround
  -mtext-section-literals              ; Xtensa S3: allow literals in .text section
  -DCONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
;   -DASYNCWEBSERVER_REGEX=1
; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-7 (TouchMeteo-7 pack) — ESP32-S3, native USB only
; CDC_ON_BOOT = 1 — no CH340 bridge; Serial only works via native USB CDC
; (same USB constraint as waveshare_8di8do). Doc: docs/waveshareLCDTouch7.md
;
; PLATFORM PIN — DO NOT BUMP without re-checking the I2C driver conflict:
;   Arduino core >= 3.2 (IDF >= 5.4) compiles Wire on the NEW i2c driver
;   (driver_ng), while ESP32_Display_Panel v1.0.4 drives touch GT911 + CH422G
;   on the LEGACY driver. Linking both aborts the chip at boot inside a
;   global constructor (E i2c: CONFLICT! ... + abort in check_i2c_driver_
;   conflict, before setup()). This is link-time, not a pin/port problem —
;   no code arrangement avoids it.
;   53.03.13-1 = Arduino 3.1.x + IDF 5.3.x => Wire is LEGACY, same driver as
;   the panel stack => no conflict. Satisfies Waveshare's requirement
;   (Arduino board package >= 3.0.6). F1 adds GFX/touch/LVGL lib_deps to this
;   env ONLY (packs atuais intocados).
;   Cost (see DUAL-PLATFORM MAP below): switching platforms re-downloads
;   ~322 MB once + full rebuild (ccache cannot hit across versions).
; ---------------------------------------------------------------------------
[env:s3_touch7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Full pre-script list: an [env:x] extra_scripts REPLACES the [env] base list
; (same reason esp32p4 carries its own full list), so repeat it here plus the
; TOUCH7 bounce patch. Verified live: with only the patch line, pio skips
; validation/LDF/SCons entirely and reports bogus SUCCESS in ~5 s.
extra_scripts =
  pre:scripts/validate_i18n.py
  pre:scripts/validate_feature_flags.py
  pre:scripts/validate_packs.py
  pre:scripts/validate_third_party.py
  pre:scripts/validate_version.py
  pre:scripts/inject_pack_flags.py
  pre:scripts/run_native_tests.py
  pre:scripts/patch_touch7_bounce.py
  pre:scripts/ccache.py
  pre:fix_includes.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
lib_deps =
  ${env.lib_deps}
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  https://github.com/lvgl/lvgl.git#v9.6.0
  https://github.com/Bodmer/JPEGDecoder.git#2.0.0
build_flags =
  ${env.build_flags}
  -DTARGET_BOARD_S3_TOUCH7=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSELECTED_PACK=PACK_S3_TOUCH7
  -mfix-esp32-psram-cache-issue        ; Xtensa S3: PSRAM cache errata workaround
  -mtext-section-literals              ; Xtensa S3: allow literals in .text section
  -DCONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
  -DLV_CONF_INCLUDE_SIMPLE
  -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7


; ---------------------------------------------------------------------------
; ESP32-P4-Module-DEV-KIT (Waveshare) — RMII Ethernet built-in + WiFi via C6
; P4 notes:
;   - RISC-V core — no Xtensa flags (-mfix-esp32-psram-cache-issue, -mtext-section-literals)
;   - PSRAM is 32 MB stacked internal — no OPI flags, RESERVE_INTERNAL=0
;   - Ethernet via ETH.h RMII — arduino-libraries/Ethernet (W5500) NOT needed
;   - WiFi via ESP32-C6 companion over SDIO (do NOT use GPIO14-19 for user peripherals)
;   - Native USB only (no UART bridge chip) — CDC_ON_BOOT must be 1 for Serial
;   - USB Host (ENABLE_USB_HOST=1): uses OTG HS in host mode; Serial CDC unavailable
;     when Host is active — use UART0 (GPIO43/44) or Telnet for debug instead
;   - Board ID: esp32-p4 (ES/pre-rev3 silicon, matches eco2 ROM banner)
;   - Platform: pioarduino 55.03.35 / IDF 5.5.1 (inherited from [env])
; ---------------------------------------------------------------------------
[env:esp32p4]
board = esp32-p4
; P4 pinned to 55.03.35 (Arduino 3.3.5 / IDF 5.5.1), same as all S3 envs.
; 3.3.11 regressed P4 heap by ~200 KB (arduino-esp32#12847, SDIO) and broke
; S3 USB Host (arduino-esp32#12783). CAM_P4 needs 3.3.12 (ESP_Video MIPI)
; so it builds on [env:esp32p4cam] below — see DUAL-PLATFORM MAP there.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
extra_scripts =
  pre:scripts/validate_i18n.py
  pre:scripts/validate_feature_flags.py
  pre:scripts/validate_packs.py
  pre:scripts/validate_third_party.py
  pre:scripts/validate_version.py
  pre:scripts/inject_pack_flags.py
  pre:scripts/remove_arm_asm.py
  pre:scripts/ccache.py
  pre:fix_includes.py
build_src_filter = ${common_build.build_src_filter}
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
lib_deps =
	bblanchon/ArduinoJson @ 6.21.6
	ESP32Async/AsyncTCP @ 3.5.0
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	rlogiacco/CircularBuffer @ 1.4.0
	adafruit/Adafruit SSD1306 @ 2.5.17
	adafruit/Adafruit GFX Library @ 1.12.6
  arduino-libraries/Ethernet @ 2.0.2
	greiman/SdFat @ 2.3.1
  ; ReadyMail pinned to 0.4.0 (MIT); 0.4.1+ are non-commercial — see [env] above.
  mobizt/ReadyMail @ 0.4.0
  mobizt/ESP_SSLClient @ 3.1.3
  ; The radio stack uses first-party audio_core.h + minimp3/dr_flac + native I2S.
  ; Radio pack is locked to N16R8 in this project build flow.
  ; Keep Ethernet lib for shared headers that include <Ethernet.h>.
  ; Runtime networking on P4 still uses internal RMII MAC via ETH.h.
  ; ReadyMail is still required by current SMTP symbols included by chatgpt.ino.
build_flags =
  ${common_build.build_flags}
  -DTARGET_BOARD_P4=1
  -DSELECTED_PACK=6            ; PACK_P4_CNC = 6 (override user_config.h default for P4)
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; esp_cache_msync wrapper to fix IDF 5.5.1 NULL deref bug on P4 USB Host
  -Wl,--wrap=esp_cache_msync
  ; P4: 32 MB stacked PSRAM — reserve 0 bytes internal RAM (override [env] default)
  -DCONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
  ; P4 PSRAM is on internal 200 MHz bus (~10 ns latency, vs ~40 ns OPI on S3).
  ; Lower threshold from [env]'s 65536 to 4096: allocs >4KB go to PSRAM,
  ; freeing internal SRAM (768 KB) for task stacks, DMA buffers, and ISR data.
  -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
  ; Reduce loop() stack: P4 loop is thin (loop_impl.h); 8 KB is sufficient.
  ; Internal SRAM saved vs [env]'s 16 KB default: 8 KB.
  -DARDUINO_LOOP_STACK_SIZE=8192
  ; USB Host CDC-ACM IDF config (active only when ENABLE_USB_HOST=1)
  -DCONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=256
  ; P4 USB OTG mode:
  ;   ARDUINO_USB_MODE=1 → device/CDC (Serial works, USB Host disabled)
  ;   ARDUINO_USB_MODE=0 → host mode (USB Host works, Serial CDC unavailable)
  ; otg11 FS (ports 1-3): usb_phy API lives in esp_private/usb_phy.h. pioarduino only
  ; exposes the libs' top-level include/ dir, NOT the nested usb/include, so __has_include
  ; fails and USB_HOST_HAVE_PHY_API stays undefined (FS host code compiled out).
  ; Add the nested include so UBS_HOST_P4_OTG11_FS_HOST=1 can bring up OTG11 FS.
  -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/usb/include

  ; This env is dedicated to ESP32-P4 CNC/USB-Host workflows; keep mode=0.
  ; Keep CDC_ON_BOOT=0 to avoid TinyUSB device stack startup while running host mode.
  -DARDUINO_USB_MODE=0

; ---------------------------------------------------------------------------
; DUAL-PLATFORM MAP — test a platform bump on one/two packs before rolling
; out to all builds. Packs are routed to envs by pack_env_override() in
; build_firmware.sh (and :resolve_env in build_firmware.bat), NOT by board.
;
;   Current routing (2026-09-13, heap regression arduino-esp32#12847):
;     CAM_P4            -> esp32p4cam (3.3.12, needs ESP_Video MIPI)
;     S3_TOUCH7         -> s3_touch7 pinned to 53.03.13-1 (Arduino 3.1.x/IDF 5.3,
;                          PERMANENT: panel stack needs legacy I2C Wire, see env)
;     everything else   -> board default env (3.3.5)
;
;   To trial a bump on another pack (S3 or P4), e.g. RAMBOX on 3.3.11:
;     1. Add env:  [env:n16r8next]  +  extends = env:n16r8  +  platform = <new URL>
;     (section name, not bare env name — bare `extends = n16r8` is silently
;     ignored and the env falls back to [env] defaults: board=None, which
;     later dies with "TypeError: cannot unpack non-iterable NoneType" in
;     setup_python_env — verified 2026-09-14 on esp32p4cam)
;     2. Map it:   one line in pack_env_override() / :resolve_env:
;                      RAMBOX) echo "n16r8next" ;;
;   To roll out globally, move the platform URL into the base env instead
;   and delete the -next env + its mapping lines.
;
;   COST WARNING (verified 2026-09-13): both platforms would share one package
;   dir (packages/framework-arduinoespressif32, URL deps install unversioned),
;   so every switch between 3.3.5 and 3.3.12 envs re-downloads ~322 MB of
;   framework ONCE and rebuilds fully (ccache cannot hit across versions).
;   build_firmware.sh routes esp32p4cam to its own core dir (~/.platformio-p4cam)
;   + .pio-p4cam tree (run_env_pio) exactly to avoid this; a bare
;   `pio run -e esp32p4cam` does NOT isolate and pays the full switch cost.
;   pioarduino also swallows the install failure and dies later with a bare
;   "TypeError: cannot unpack non-iterable NoneType" in setup_python_env —
;   if that hits, run:  pio pkg uninstall framework-arduinoespressif32
;   framework-arduinoespressif32-libs   ...then rebuild (re-downloads clean).
; ---------------------------------------------------------------------------
[env:esp32p4cam]
extends = env:esp32p4
; CAM_P4-only platform: Arduino 3.3.12 (ESP_Video + P4 MIPI camera stack).
; 3.3.11 cost was ~200 KB less internal heap (SDIO/esp_hosted pre-alloc,
; arduino-esp32#12847). 3.3.12 (released 19-09-2026) MAY include the upstream
; mempool fixes (lib-builder #398 CONFIG_ESP_HOSTED_USE_MEMPOOL=n, esp_hosted
; mempool leak fixes) — EXPECT PARTIAL recovery only: per-channel pools +
; AMPDU stay by design (maintainer: revert "not viable", esp-hosted-mcu#191).
; After rebuild, measure free_internal + largest_block_internal via
; /api/status vs baseline 88 KB free / 33 KB largest block.
; NO rollback to 3.3.5 for CAM_P4: ESP_Video header absent
; there (backend stubs, no MIPI) and no usb_host_uvc either — 3.3.5 means
; no camera at all. Other packs stay on 3.3.5 meanwhile (unaffected).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; Drop the inherited -DSELECTED_PACK=6 (PACK_P4_CNC): build_firmware.sh exports
; -DSELECTED_PACK=PACK_CAM_P4 via PLATFORMIO_BUILD_FLAGS (run_env_pio). Without
; this both defines land on the command line ("SELECTED_PACK redefined" on
; every TU). -DTARGET_BOARD_P4=1 stays inherited (the script no longer repeats it).
build_unflags =
  -DSELECTED_PACK=6
; Force-build the framework ESP_Video lib (ESP_Video.cpp). The LDF scanner
; cannot evaluate camera_p4_backend.cpp's guard (SELECTED_PACK == PACK_CAM_P4:
; PACK_CAM_P4 is a header macro, not a numeric -D), so it never registers the
; lib — the header still compiles via fix_includes.py -I, but linking then
; fails with "undefined reference to ESPVideo*". An explicit lib_deps entry
; is built unconditionally, no scanner involved. Verified 2026-09-14.
lib_deps =
  ${env:esp32p4.lib_deps}
  file://${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESP_Video
; Vendored OV5647 driver (sensor_ov5647/**, HD modes override): compiled ONLY
; here. The -D set mirrors the prebuilt core's sdkconfig, except ALL FIVE
; MIPI modes are enabled (core has only 800x800). Default stays 800x800
; (INDEX_DEFAULT=2) for a safe boot; HD modes switch at runtime via S_FMT.
build_src_filter = ${common_build.build_src_filter} +<sensor_ov5647/**>
build_flags =
  ${env:esp32p4.build_flags}
  -DCONFIG_CAMERA_OV5647_AUTO_DETECT_MIPI_INTERFACE_SENSOR=1
  -DCONFIG_CAMERA_OV5647_CSI_LINESYNC_ENABLE=1
  ; HD-ONLY BOOT EXPERIMENT (2026-09-26): REVERTED — even with only 1080p
  ; offered, the pipeline boots 800x800 (the prebuilt esp_video selects it
  ; explicitly; marker SHADOW-OV5647 proved our driver is live). Full offer
  ; restored; HD now waits on a newer core (see env platform override).
  -DCONFIG_CAMERA_OV5647_MIPI_RAW8_800X640_50FPS=1
  -DCONFIG_CAMERA_OV5647_MIPI_RAW8_800X800_50FPS=1
  -DCONFIG_CAMERA_OV5647_MIPI_RAW8_800X1280_50FPS=1
  -DCONFIG_CAMERA_OV5647_MIPI_RAW10_1920X1080_30FPS=1
  -DCONFIG_CAMERA_OV5647_MIPI_RAW10_1280X960_BINNING_45FPS=1
  ;  ; HD probe: boot the sensor in RAW10 1920x1080 (index 3) instead of the
  ;  ; safe 800x800 (index 2). Reverted to index 2 (safe boot) for HD validation:
  ;  ; the P4BeginGuard I2C0 arbitration + VIDIOC_S_SENSOR_FMT switch the sensor
  ;  ; to 1080p at runtime (cameraP4SetResolution), which is the intended path.
  ;  ; (index 3 boot via the shadow TU races the SCCB bus and fails ready=False.)
  -DCONFIG_CAMERA_OV5647_MIPI_IF_FORMAT_INDEX_DEFAULT=2
  -DCONFIG_CAMERA_OV5647_MIPI_DEFAULT_FMT_RAW8_800X800_50FPS=1
