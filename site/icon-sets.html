<!doctype html><meta charset="utf-8">
<style>

  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 system-ui,sans-serif;padding:26px 30px}
  h1{font-size:15px;letter-spacing:-.01em;margin:0 0 18px;font-weight:620}
  table{border-collapse:collapse}
  th,td{padding:12px 18px;border-bottom:1px solid #232c27;text-align:left;vertical-align:middle}
  th{font:500 12px/1 system-ui;color:#94a09a;font-weight:500}
  td.k{font:600 13px/1.3 system-ui;color:var(--ink);width:120px}
  td.c{width:86px}
  svg{display:block;width:26px;height:26px}
  .solid{fill:var(--ink);stroke:none}
  .duo-a{fill:var(--ink);opacity:.32;stroke:none}
  .duo-b{fill:var(--ink);stroke:none}
  .line{fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linejoin:miter;stroke-linecap:square}
  .bold{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
