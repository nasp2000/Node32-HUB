<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>bricon_asset (Test)</title>
</head>
<body>
    <main class='page'>
        <div class='wrap'>
            <div class='actions nav-inicio'><a href='/' class='btn' data-i18n='btnHome'>&#127968; In&iacute;cio</a></div>
            <h1>&#128330; <span data-i18n='briconTitle'>Bricon Rambox</span></h1>
            <div class='uk-tabs' id='briconTabBar'>
                <button type='button' class='uk-tab-btn active' onclick='bkSwitchTab(0)'><span data-i18n='briconTab1'>Status & Config</span></button>
                <button type='button' class='uk-tab-btn' onclick='bkSwitchTab(1)'><span data-i18n='briconTab2'>Arrivals & Contests</span></button>
                <button type='button' class='uk-tab-btn' onclick='bkSwitchTab(2)'><span data-i18n='briconTab3'>Pigeon Loft</span></button>
                <button type='button' class='uk-tab-btn' onclick='bkSwitchTab(3)'><span data-i18n='briconTab4'>Training</span></button>
            </div>
            <div class='uk-tab-panel active' id='bk-tab-0'>
                <div id='bk-sec-status' class='section'><h3>Status</h3><div id='briconStatus'>loading...</div><div><span id='bkStatTotal'>--</span><span id='bkStatContests'>--</span><span id='bkStatPombal'>--</span><span id='bkStatAgo'>--</span></div></div>
                <div id='bk-sec-config' class='section'><h3>Config</h3><form id='briconForm'><input type='checkbox' id='briconEnabled'><select id='briconInterval'><option value='0'>Manual</option></select><select id='briconBaud'><option value='9600'>9600</option></select></form></div>
            </div>
            <div class='uk-tab-panel' id='bk-tab-1'>
                <div id='bk-sec-arrivals' class='section'><h3>Arrivals</h3><table><tbody id='briconArrivalsBody'></tbody></table></div>
                <div id='bk-sec-contests' class='section'><h3>Contests</h3><table><tbody id='briconContestsBody'></tbody></table></div>
            </div>
            <div class='uk-tab-panel' id='bk-tab-2'>
                <div id='bk-sec-pombal' class='section'><h3>Loft</h3><table><tbody id='briconPombalBody'></tbody></table></div>
            </div>
            <div class='uk-tab-panel' id='bk-tab-3'>
                <div id='bk-sec-training' class='section'><h3>Training</h3></div>
            </div>
        </div>
    </main>
<script>
    function bt(s, fb) { try { var el = document.querySelector("[data-i18n='" + s + "']"); if (el && el.textContent && el.textContent.trim().length > 0 && el.textContent !== s) return el.textContent; } catch (e) {} return fb; }
    function besc(s) { s = (s === null || s === undefined) ? '' : String(s); return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    var bkTabs = [['bk-tab-0', 'Status & Config'], ['bk-tab-1', 'Arrivals & Contests'], ['bk-tab-2', 'Pigeon Loft'], ['bk-tab-3', 'Training']];
    function bkSwitchTab(idx) {
        var btns = document.querySelectorAll('#briconTabBar .uk-tab-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', i === idx);
        for (var p = 0; p < 4; p++) {
            var el = document.getElementById('bk-tab-' + p);
            if (el) el.classList.toggle('active', p === idx);
        }
    }
    function bkShowTab(idx) { bkSwitchTab(idx); }
    function bkBuildTabs() { bkSwitchTab(0); }

    function loadBriconStatus() {
        fetch('/api/bricon-status', {cache: 'no-store'})
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var el = document.getElementById('briconStatus');
                if (!el) return;
                el.textContent = (d && d.activeModule ? d.activeModule : 'none') + '/' + (d && d.connected ? 'on' : 'off');
            })
            .catch(function() {});
    }
    function briconCat(c) {
        return (c === 1) ? 'OLD' : (c === 2) ? 'YEA' : (c === 3) ? 'YOU' : '';
    }
    function briconRow(a, n) {
        var h = (a.time && a.time.length === 6 && a.time !== '000000')
            ? a.time.substring(0,2) + ':' + a.time.substring(2,4) + ':' + a.time.substring(4,6) : '-';
        var dt = (a.date && a.date.length >= 4 && a.date.substring(0,4) !== '0000')
            ? a.date.substring(0,2) + '/' + a.date.substring(2,4) : '-';
        var vel = (a.speed > 0) ? a.speed : '';
        return '<tr><td>' + n + '</td><td>' + besc(a.ring) + '</td>'
            + '<td>' + besc(a.chip) + '</td><td>' + h + '</td>'
            + '<td>' + dt + '</td><td>' + besc(a.race || '') + '</td>'
            + '<td>' + briconCat(a.category) + '</td><td>' + vel + '</td></tr>';
    }
    function loadBriconArrivals() {}
    function loadBriconPombal() {}
    function loadBriconContests() {}
    function briconPoll() { fetch('/api/bricon-poll', { method: 'POST' }); }
    function briconReset() { fetch('/api/bricon-reset', { method: 'POST' }); }
    function briconSyncCalendar() { fetch('/api/bricon-sync-calendar', { method: 'POST' }); }
    function briconSyncPombal() { fetch('/api/bricon-sync-pombal', { method: 'POST' }); }
    function briconSendTraining() { fetch('/api/bricon-send-training', { method: 'POST' }); }
    function briconClearTraining() { fetch('/api/bricon-clear-training', { method: 'POST' }); }
    function saveBriconConfig() {
        var params = 'enabled=' + (document.getElementById('briconEnabled').checked ? '1' : '0');
        fetch('/api/bricon-config', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
    }

    bkBuildTabs();
    loadBriconStatus();
    </script>
</body>
</html>
