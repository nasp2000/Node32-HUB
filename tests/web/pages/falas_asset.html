<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Falas (Test) (Test)</title>
</head>
<body>

<div class="wrap">
<a class="btn" href="/" data-i18n="btnHome">Inicio</a>
<h1 data-i18n="touch7Falas">🔊 Falas locais</h1>
<p>Frases WAV em <code>/falas</code> (16-bit PCM mono, 16 kHz). Para enviar ficheiros novos use a pagina <a href="/files">Ficheiros</a>.</p>
<div class="card">
<button class="btn" id="bFalasRef">Atualizar lista</button>
<span id="falasStatus">A carregar...</span>
<table id="falasTable"><thead><tr><th>Ficheiro</th><th>Tamanho</th><th></th><th></th></tr></thead><tbody id="falasBody"></tbody></table>
</div>
<div class="card">
<h2 data-i18n="touch7Peers">Peers (viewer 2+2)</h2>
<p>Configure os nodes remotos (ex. pack CAM) em JSON e grave. Teste com o botao.</p>
<textarea id="peersJson" rows="10" cols="60"></textarea><br>
<button class="btn" id="bPeersLoad">Ler config</button>
<button class="btn" id="bPeersSave">Guardar</button>
<button class="btn" id="bPeersTest" data-i18n="touch7Test">Testar agora</button>
</div>

<script>
// ===== MOCK API LAYER =====
(function() {
  window.fetch = function(url, opts) {
    var u = typeof url === 'string' ? url : (url && url.url ? url.url : '');
    var MOCKS = typeof window.__MOCK_API__ !== 'undefined' ? window.__MOCK_API__ : {};
    if (opts && opts.method && opts.method !== 'GET') {
      window.__postBodies = window.__postBodies || [];
      window.__postBodies.push({ url: u, method: opts.method, body: opts.body || '' });
    }
    var mock = MOCKS[u];
    if (!mock) {
      for (var k in MOCKS) {
        if (u.indexOf(k) >= 0) { mock = MOCKS[k]; break; }
      }
    }
    if (typeof mock === 'function') mock = mock();
    return Promise.resolve({
      ok: true, status: 200,
      json: function() { return Promise.resolve(mock || {}); },
      text: function() { return Promise.resolve(JSON.stringify(mock || {})); }
    });
  };
  window.customAlert = function(m) { console.log('[mock] customAlert:', m); };
  window.customConfirm = function(m, cb) { if (cb) cb(true); };
  window.showLoading = function() {};
  window.hideLoading = function() {};
  window.disableBtn = function(b) { if (b) { b.disabled = true; } };
  window.enableBtn = function(b) { if (b) { b.disabled = false; } };
  window.showSavedCard = function() {};
  // Feature flags used by some pages (default: off)
  window._rs232Enabled = false;
  window._modbusEnabled = false;
  window.__test__ = {};  // ensure window.__test__ exists even on non-IIFE pages
})();
</script>

<script>
function falasShow(m){ customAlert(m); }
function falasLoad(){
  fetch('/api/falas').then(function(r){ return r.json(); }).then(function(d){
    var tb = $('falasBody'); tb.innerHTML = '';
    if(!d.success || !d.files || !d.files.length){ $('falasStatus').textContent = 'Sem ficheiros.'; return; }
    $('falasStatus').textContent = d.files.length + ' ficheiro(s).';
    d.files.forEach(function(f){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td></td><td></td><td></td>';
      tr.children[0].textContent = f.name;
      tr.children[1].textContent = f.size;
      var bP = document.createElement('button'); bP.className = 'btn'; bP.textContent = 'Ouvir';
      bP.onclick = function(){ falasPlay(f.name); };
      var bD = document.createElement('button'); bD.className = 'btn'; bD.textContent = 'Apagar';
      bD.onclick = function(){ customConfirm('Apagar ' + f.name + '?', function(){ falasDel(f.name); }); };
      tr.children[2].appendChild(bP); tr.children[3].appendChild(bD);
      tb.appendChild(tr);
    });
  });
}
function falasPlay(n){
  fetch('/api/falas-play?file=' + encodeURIComponent(n), {method:'POST'}).then(function(r){ return r.json(); }).then(function(d){
    if(d.success) falasShow('A tocar ' + n); else falasShow('Falha: ' + (d.msg || '?'));
  });
}
function falasDel(n){
  fetch('/api/falas-delete?file=' + encodeURIComponent(n), {method:'POST'}).then(function(r){ return r.json(); }).then(function(d){
    if(d.success){ falasShow('Apagado.'); falasLoad(); } else falasShow('Falha: ' + (d.msg || '?'));
  });
}
function peersLoad(){
  fetch('/api/touch7-config').then(function(r){ return r.json(); }).then(function(d){
    if(d.success) $('peersJson').value = JSON.stringify(d, null, 1);
  });
}
function peersSave(){
  fetch('/api/touch7-config', {method:'POST', headers:{'Content-Type':'application/json'}, body:$('peersJson').value}).then(function(r){ return r.json(); }).then(function(d){
    if(d.success) falasShow('Guardado.'); else falasShow('Falha a guardar.');
  });
}
function peersTest(){
  fetch('/api/touch7-peer-refresh', {method:'POST'}).then(function(r){ return r.json(); }).then(function(d){
    if(d.success) falasShow('A atualizar peers...'); else falasShow('Falha.');
  });
}
if (typeof $ !== 'undefined' && $('bFalasRef')) {
  $('bFalasRef').onclick = falasLoad;
  $('bPeersLoad').onclick = peersLoad;
  $('bPeersSave').onclick = peersSave;
  $('bPeersTest').onclick = peersTest;
  falasLoad();
}
window.__test__ = window.__test__ || {};
window.__test__.falasRow = function(name, size){
  return {name: name, size: size, label: name + ' (' + size + ' B)'};
};
window.__test__.falasSafe = function(name){
  if(!name || name.length > 64) return false;
  if(name.indexOf('..') >= 0 || name.indexOf('/') >= 0) return false;
  return name.endsWith('.wav') || name.endsWith('.WAV');
};
</script>
